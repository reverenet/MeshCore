# Every setting a network profile can carry, what it does, and a value worth starting
# from. Nothing here is switched on: it is a menu, not a profile. Copy it, uncomment the
# handful of lines your network actually needs, and delete the rest - a profile that
# states only what it means to change is one somebody can read.
#
#   mkdir -p ~/.reverenet/configs
#   cp examples/configs/sample.conf ~/.reverenet/configs/mynetwork.conf
#   make firmware FIRMWARE=<target> VERSION=<ver> CONFIG=~/.reverenet/configs/mynetwork.conf
#
# A profile lives under REVERENET_HOME (~/.reverenet by default), not in the checkout: it
# names a real network, it outlives any one clone, and a file in the tree is one
# 'git add .' away from being published. Name it reverenet.conf there and it is the
# default, with no CONFIG= needed. This file is the exception - it names no network.
#
# FORMAT: NAME = VALUE, one per line, # starts a comment. A value may not contain spaces.
# Everything here is a DEFAULT - the same name passed to make wins, so
# `make firmware ... LORA_SF=8` overrides one line without editing the file.
#
# WHAT APPLIES WHERE is marked on each group. A setting meant for a companion does
# nothing in a repeater build and vice versa; it is not an error, it just has no effect.
#
# 'make help' documents every one of these as a build argument, and the firmware headers
# they come from carry the reasoning: examples/companion_radio/AutoAdvert.h for adverts
# and tracking, src/helpers/PositionHistory.h for the history request.


# ============================================================================== radio
#
# All builds. The first four must match the rest of the network EXACTLY - a node that
# differs on frequency, bandwidth or spreading factor does not hear the mesh at all, and
# gets no indication of why. Unset means the variant's own setting, which differs by
# board and is not a network-wide answer.
#
# The values below are the USA/Canada preset. Check what your region and your network use
# before copying them anywhere.

# LORA_FREQ = 910.525          # MHz
# LORA_BW   = 62.5             # kHz. Narrower reaches further and carries less
# LORA_SF   = 7                # 5-12. Higher is slower, more sensitive, more airtime
# LORA_CR   = 5                # 5-8. Higher is more error correction and more airtime

# TX power in dBm. Normally left to the variant, because the sensible value depends on
# the board's PA and its antenna rather than on the network. Set it here only for a
# deployment that has to pin it.
# LORA_TX_POWER = 20


# ============================================================================ channels
#
# Companion builds. Group channels the node creates for itself on first boot, so a device
# arrives already on the network instead of every owner pasting the same PSKs into the
# app. Comma-separated names, no spaces: letters, digits, dot, underscore and dash.
#
# Only the names go here - a profile gets shared. The key for each is read from
# keys/channels.key under REVERENET_HOME, which does not, and `make keys` generates one
# for any channel that has none yet. Every node on a channel must be built from the same
# copy of that file; `make keys` prints a fingerprint per channel so two machines can be
# checked against each other without either key being shown.
#
# A channel is added only when the device does not already have it, matched on the key
# rather than the name: renaming one in the app sticks, deleting one there brings it back
# on the next boot. The built-in Public channel takes one of the variant's channel slots,
# and a profile naming more than the rest can hold fails to build rather than quietly
# dropping the last one.

# CHANNELS = ops,sar,neighbours


# ============================================================================= regions
#
# Repeater builds. Comma-separated flood scopes to create, enabled, on a device with none
# configured yet - it will not undo an operator's saved setup. The FIRST name is the scope
# this node originates its own floods in.
#
# List every scope the node should relay. A flood travels only where every repeater on the
# path has that region configured, so dropping one silently shortens how far traffic in
# that scope goes.

# DEFAULT_REGIONS = ma,newengland,us

# Room server and sensor builds, which take a single scope instead of a list.
# DEFAULT_FLOOD_SCOPE_NAME = mynetwork


# ================================================================================= GPS
#
# Boards built with ENV_INCLUDE_GPS and a receiver actually detected. Elsewhere the
# setting is refused and nothing changes.

# Whether the receiver is switched on at first boot. 1 on a companion, 0 on a repeater,
# which is normally a fixed install with a hand-set position. Only applies to a device
# with no saved prefs - use 'gps on' over the CLI, or the app's toggle, for one already
# in the field. Worth setting to 0 on a battery node where the GPS is the largest draw.
# GPS_ENABLED = 1

# Seconds between position updates. 0 leaves the sensor manager's own cadence alone,
# which is once a second - fast enough that a tracking sample is never stale.
# GPS_INTERVAL = 0


# ==================================================================== position reports
#
# Companion builds, and all of it needs a tracking key: without TRACKING_KEY in the build
# the whole feature is compiled out and these do nothing. The key comes from
# keys/tracking.key, never from here - see the note at the bottom.
#
# Reports are batched and broadcast on a group datagram that repeaters relay without
# being able to read. Only nodes holding the tracking key can.

# 1 = this node reports its own position. Settable at runtime as the custom variable
# 'track', so what is set here is only what a NEWLY flashed node starts with: a saved
# value survives a reflash and wins. Leave it 0 on a node that should see other nodes'
# tracks without broadcasting its own.
# TRACK_REPORT = 0

# Seconds between transmissions, 10..86400, also settable at runtime as 'track_interval'.
# The rate is deliberately constant whether or not the node has moved: airtime that
# correlates with movement tells an observer who is moving without them reading anything.
# TRACK_REPORT_SECS = 900

# How often a position is written into the batch, as opposed to how often the batch is
# sent. Sampling runs at the floor while moving and backs off towards the ceiling while
# the node sits still; travelling this far forces a sample and snaps the rate back to the
# floor. Keep the distance well above GPS noise - below ~30 m a stationary receiver's own
# wander reads as travel and the backoff never engages.
# TRACK_SAMPLE_MIN_SECS = 60
# TRACK_SAMPLE_MAX_SECS = 3600
# TRACK_SAMPLE_DIST_M   = 100

# 0 = zero-hop, so only nodes in direct earshot hear a report. 1 = scoped flood, which
# multiplies the airtime of every report by the size of the mesh. Use 1 only if the
# people who need the tracks are not within one hop of the nodes reporting.
# TRACK_FLOOD = 0


# ==================================================================== position history
#
# Companion builds, needs a tracking key. Answering one contact's question "where have you
# been since <instant>?" - see src/helpers/PositionHistory.h.
#
# A report carries the newest positions that fit and nothing is consumed by sending it, so
# a receiver that can see it is missing the stretch between two reports asks for that
# stretch and gets it back out of the same samples. It costs no extra sampling, and it
# follows the same switch reporting does: a node with TRACK_REPORT = 0 is not sampling,
# and switching reporting off discards what it held.

# How many recent samples the node holds, 12 bytes of RAM each. This is the whole store:
# reports are packed from the newest end of it, history requests are answered out of it,
# and neither consumes anything - a new sample pushes the oldest off, transmitted or not.
#
# Sizing it is about how far back somebody can ASK, not about how much can be sent: a
# report carries the newest 23 positions however deep this is. At the 60 s sampling floor
# 256 is about four hours of continuous movement, and far longer for a node that spends
# its time parked. Deeper costs RAM and nothing else.
# TRACK_HISTORY = 256

# 0 builds a node that reports its position on the cadence above and will not answer a
# history request at all - a request it ignores looks exactly like a request to a node
# that never heard of them. The samples are still held, for packing reports from.
# TRACK_ANSWER_HISTORY = 1

# What bounds one answer. Six packets is about 138 positions; what will not fit is flagged
# truncated and the asker can come back for it with a later 'since'. The gap spaces the
# packets so one answer does not hold the channel, and the minimum gap is the least time
# between two answers whoever asked - the tracking key stops a stranger asking, but not
# the same valid request being replayed.
# TRACK_HISTORY_MAX_PKTS      = 6
# TRACK_HISTORY_GAP_MS        = 3000
# TRACK_HISTORY_MIN_GAP_SECS  = 15

# 1 hands each report to the connected client as it arrives, still encrypted, so a client
# holding the tracking key can plot every position in the batch. With 0 the client sees
# only the newest position of each report, because that is all a contact record holds -
# a node reporting every 900 s then draws one point every 900 s.
# TRACK_PUSH_REPORTS = 1


# =================================================================== advert scheduling
#
# Companion builds. Adverts are how a node announces itself; these decide whether it does
# so on its own, and whether it says where it is.

# Periodic advert carrying no position, as a cheap liveness heartbeat. 0 = off.
# AUTO_ADVERT_SECS  = 3600
# AUTO_ADVERT_FLOOD = 0

# The adaptive location beacon: an advert carrying a position, sent when the node has
# travelled far enough or when the current interval elapses. 1 enables it and everything
# below tunes it.
#
# This is a different thing from position reports above, and coarser: an advert is public
# to the whole mesh, and its position is readable by anyone who hears it. Reports are for
# a group that holds a key. Do not enable this to get tracking.
#
# Firmware default is 0. Uncommenting the tuning below without this one produces a build
# warning, because settings that tune a beacon that is switched off do nothing.
# AUTO_ADVERT_LOC = 0

# NONE, SHARE or PREFS - whether an advert carries a position at all. Enabling the beacon
# defaults this to SHARE, since a location beacon with no location is pointless. Only the
# default for a new install; the app can change it afterwards.
# AUTO_ADVERT_LOC_POLICY = SHARE

# Interval floor and ceiling. While moving the beacon sits at the floor; each send from a
# standstill multiplies the interval by the backoff factor until it reaches the ceiling,
# and any real movement snaps it back to the floor.
# AUTO_ADVERT_LOC_MIN_SECS = 60
# AUTO_ADVERT_LOC_MAX_SECS = 3600
# AUTO_ADVERT_LOC_BACKOFF  = 2

# Travel that forces a send, measured from the last position actually transmitted. Keep it
# well above GPS noise for the same reason as the sampler above.
# AUTO_ADVERT_LOC_DIST_M = 100

# Spread applied to each deadline, 0-50%, so a fleet does not settle into lockstep and
# transmit in the same second forever.
# AUTO_ADVERT_LOC_JITTER_PCT = 15

# Random delay before the very first beacon. Worth setting on a large fleet: without it
# every node reports in the moment it gets a fix, so a site-wide power cut is followed by
# one synchronised burst.
# AUTO_ADVERT_LOC_STARTUP_SECS = 0

# 0 = zero-hop. Flooding position updates multiplies their airtime by the size of the
# mesh, which is rarely what a beacon wants.
# AUTO_ADVERT_LOC_FLOOD = 0


# ============================================================================ relaying
#
# Companion builds with repeat enabled. Hops an advert may accumulate before this node
# stops forwarding it. The limit that really binds is bytes rather than hops: the path
# must fit the advert blob record, which leaves 32 bytes after the cipher overhead.
# FLOOD_MAX_ADVERT = 8


# =============================================================== what does NOT go here
#
# Keys. TRACKING_KEY is rejected outright if it appears in a config file, because a
# profile gets shared and pasted into chat threads, and a key that has been anywhere near
# one of those is not a key any more. Channel keys are the same: this file names channels,
# keys/channels.key holds their keys. `make keys` generates both, under REVERENET_HOME.
#
# BLE_PIN. A per-network secret with a six-digit keyspace - it lives in keys/ble.pin, for
# the same reason, and a command line ends up in shell history and CI logs.
#
# NAME. A name identifies one device; a profile describes a network. It goes on the make
# command line, and `make firmware ... NAME='Dennis,Eric,Mike'` builds one firmware per
# name in a single run.
#
# FIRMWARE, VERSION, PORT, BINARIES_DIR and the rest of the run arguments. They say what
# to build and where to send it, which is not a property of the network. See 'make help'.
